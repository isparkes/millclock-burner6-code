<!DOCTYPE html>
<html>
    <head>
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
        <script src="http://code.jquery.com/jquery-1.12.3.min.js" integrity="sha256-aaODHAgvwQW1bFOGXMeX+pC4PZIPsvn2h1sArYOhgXQ=" crossorigin="anonymous"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS" crossorigin="anonymous"></script>
        <link href="css/clock-custom.css" rel="stylesheet">
        <title>Nixie Clock</title>
    </head>
    <body>
        <nav class="navbar navbar-inverse navbar-fixed-top">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="https://www.nixieclock.biz">Nixie Clock</a>
                </div>
                <div id="navbar" class="navbar-collapse collapse">
                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <a href="/index.html">Summary</a>
                        </li>
                        <li>
                            <a href="/clockconfig.html">Configure clock settings</a>
                        </li>
                        <li>
                            <a href="/utility.html">Utility</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container after-fixed-navbar" role="main">
            <h3 class="sub-header">Current Status</h3>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th class="col-xs-6">Name</th>
                            <th class="col-xs-6">Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>WLAN IP</td>
                            <td id="ip"></td>
                        </tr>
                        <tr>
                            <td>WLAN MAC</td>
                            <td id="mac"></td>
                        </tr>
                        <tr>
                            <td>WLAN SSID</td>
                            <td id="ssid"></td>
                        </tr>
                        <tr>
                            <td>Web URL</td>
                            <td id="clockurl"></td>
                        </tr>
                        <tr>
                            <td>Version</td>
                            <td id="version"></td>
                        </tr>
                        <tr>
                            <td>Counter counts (Autoreload <input class="form-check-input" type="checkbox" value="" id="refreshToggle" onclick="toggleRefresh()">)</td>
                            <td id="counterValues"></td>
                        </tr>
                        <tr>
                            <td>Counter repetitions</td>
                            <td id="repetitions"></td>
                        </tr>
                        <tr>
                            <td>Counter status</td>
                            <td id="status"></td>
                        </tr>
                        <tr>
                            <td>Remaining run time</td>
                            <td id="timeRemaining"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="container after-fixed-navbar" role="main">
                <h3 class="sub-header">Counter Control</h3>
                <div class="form-horizontal">
                    <div class="btn-group" role="group" aria-label="Basic example">
                        <button type="button" class="btn btn-primary" onclick="startCounter()">Start</button>
                        <button type="button" class="btn btn-primary" onclick="stopCounter()">Stop</button>
                        <button type="button" class="btn btn-primary" onclick="resetCounter()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </body>

<script>
    getClockSummary = function getClockSummary() {
        var deferred = $.Deferred();
        console.log('get summary');
        var ajaxOptions = {
            url: '/api/getSummary',
            type: 'GET',
            Accept: 'application/json; charset=utf-8'
        };
        $.ajax(ajaxOptions).done(function (summary) {
            console.log("Received data: " + JSON.stringify(summary));
            deferred.resolve(summary);
        }).fail(function (jqXHR) {
            console.log("Get api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    getSummary = function() {
        getCounterStatus();
        getClockSummary().then(function(summary){
            $("#ip").text(summary.ip);
            $("#mac").text(summary.mac);
            $("#ssid").text(summary.ssid);
            $("#clockurl").html("<a href=\""+summary.clockurl+"\">"+summary.clockurl+"</a>");
            $("#version").text(summary.version);
        })
        .then(() => removeLoader());
    };

    getCounterStatusAPI = function getCounterStatusAPI() {
        var deferred = $.Deferred();
        console.log('get counter status');
        var ajaxOptions = {
            url: '/api/counterStatus',
            type: 'GET',
            Accept: 'application/json; charset=utf-8'
        };
        $.ajax(ajaxOptions).done(function (summary) {
            console.log("Received data: " + JSON.stringify(summary));
            deferred.resolve(summary);
        }).fail(function (jqXHR) {
            console.log("Get api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    getCounterStatus = function() {
        getCounterStatusAPI().then(function(status){
            $("#counterValues").text(status.counterValuesCurrent);
            $("#repetitions").text(status.repetitions);
            $("#status").text(status.counterStatus);

            // Calculate run time
            var timeRemainingThisLoop = status.counterValuesCurrent.split(";").map(function(item) { return parseInt("0"+item, 10); }).reduce((accumulator, currentValue) => { return accumulator + currentValue},0);
            var timeRemainingFullLoops = status.counterValuesInitial.split(";").map(function(item) { return parseInt("0"+item, 10); }).reduce((accumulator, currentValue) => { return accumulator + currentValue},0);

            var timeRemaining = timeRemainingThisLoop;
            if (status.repetitions > 1) timeRemaining+=(timeRemainingFullLoops*(status.repetitions-1));

            // Convert to readable
            var days = parseInt(timeRemaining / 86400);
            timeRemaining = timeRemaining - (days*86400);
            var hours = parseInt(timeRemaining / 3600);
            timeRemaining = timeRemaining - (hours*3600);
            var minutes = parseInt(timeRemaining / 60);
            timeRemaining = timeRemaining - (minutes*60);
            seconds = timeRemaining;

            if (days > 0) {
                timeString = days.toString().padStart(2, '0') + 'd ' +
                    hours.toString().padStart(2, '0') + 'h' + 
                    minutes.toString().padStart(2, '0') + 'm' + 
                    seconds.toString().padStart(2, '0') + 's';
            } else {
                timeString = hours.toString().padStart(2, '0') + 'h' + 
                    minutes.toString().padStart(2, '0') + 'm' + 
                    seconds.toString().padStart(2, '0') + 's';
            }

            $("#timeRemaining").text(timeString);
        });
    };

    var refreshTimer = null;

    function statusTimer() {
        getCounterStatus();
        toggleRefresh();
    }

    function toggleRefresh() {
        var checkedValue = $('#refreshToggle').is(":checked");
        if (checkedValue) {
            refreshTimer = setTimeout(statusTimer, 1000);
        } else {
            clearTimeout(refreshTimer);
        }
    }

    function addLoader() {
        $('body').append('<div style="" id="loadingDiv"><div class="loader">Loading...</div></div>');
    }

    function removeLoader(){
        $( "#loadingDiv" ).fadeOut(500, function() {
            $( "#loadingDiv" ).remove();
        });
    }

    doGet = function getClockSummary(urlToHit) {
        var deferred = $.Deferred();
        console.log('get summary');
        var ajaxOptions = {
            url: urlToHit,
            type: 'GET',
            Accept: 'application/json; charset=utf-8'
        };
        $.ajax(ajaxOptions).done(function (data) {
            console.log("Received data: " + JSON.stringify(data));
            deferred.resolve(data);
        }).fail(function (jqXHR) {
            console.log("Get api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };
        
    startCounter = function () {
        addLoader();
        getCounterStatus();
        doGet('/api/startCounter').then(function (config) {
            removeLoader();
        }).then(function () { getCounterStatus();});
    }    

    stopCounter = function () {
        addLoader();
        doGet('/api/stopCounter').then(function (config) {
            removeLoader();
        }).then(function () { getCounterStatus();});
    }    

    resetCounter = function () {
        addLoader();
        doGet('/api/resetCounter').then(function (config) {
            removeLoader();
        }).then(function () { getCounterStatus();});
    }    

    addLoader();
    getSummary();
</script>
</html>
