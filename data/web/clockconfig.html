<!DOCTYPE html>
<html>
    <head>
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
        <script src="http://code.jquery.com/jquery-1.12.3.min.js" integrity="sha256-aaODHAgvwQW1bFOGXMeX+pC4PZIPsvn2h1sArYOhgXQ=" crossorigin="anonymous"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS" crossorigin="anonymous"></script>
        <link href="css/clock-custom.css" rel="stylesheet">
        <title>Nixie Clock</title>
    </head>
    <body>
        <nav class="navbar navbar-inverse navbar-fixed-top">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="https://www.nixieclock.biz">Millclock Tube Burner</a>
                </div>
                <div id="navbar" class="navbar-collapse collapse">
                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <a href="/index.html">Summary</a>
                        </li>
                        <li>
                            <a href="/clockconfig.html">Configure settings</a>
                        </li>
                        <li>
                            <a href="/utility.html">Utility</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container after-fixed-navbar" role="main">
            <h3 class="sub-header">Digit Timings (Seconds)</h3>
            <div class="form-horizontal">

                <div class="form-group">
                    <label class="control-label col-xs-3">Tube Type:</label>
                    <div class="col-xs-2">
                        <select class="form-control" name="tubeType" id="tubeType" onChange="handleTubeTypeChange()">
                            <option value="0">ZIN70</option>
                            <option value="1">ZIN18</option>
                        </select>
                    </div>
                </div>    

                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-0">Digit 0:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-0" id="time-1-0" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-1">Digit 1:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-1" id="time-1-1" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-2">Digit 2:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-2" id="time-1-2" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-3">Digit 3:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-3" id="time-1-3" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-4">Digit 4:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-4" id="time-1-4" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-5">Digit 5:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-5" id="time-1-5" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-6">Digit 6:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-6" id="time-1-6" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-7">Digit 7:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-7" id="time-1-7" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-8">Digit 8:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-8" id="time-1-8" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-9">Digit 9:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-9" id="time-1-9" min="0" max="999" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="time-1-9">Digit K:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="time-1-K" id="time-1-K" min="0" max="999" value="10">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Save" onclick="postConfig()">
                    </div>
                </div>
            </div>

            <div class="container after-fixed-navbar" role="main">
                <h3 class="sub-header">Repetitions</h3>
                <div class="form-horizontal">
                        <div class="form-group">
                    <label class="control-label col-xs-3" for="repetitions">Repetitions:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="repetitions" id="repetitions" min="1" max="99" value="10">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Save" onclick="postConfig()">
                    </div>
                </div>
            </div>

            <div class="container after-fixed-navbar" role="main">
                <h3 class="sub-header">Tube Board Count</h3>
                <div class="form-horizontal">
                        <div class="form-group">
                    <label class="control-label col-xs-3" for="tubeboardcount">Tube Board Count:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="tubeboardcount" id="tubeboardcount" min="1" max="99" value="3">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Save" onclick="postConfig()">
                    </div>
                </div>
            </div>
        </div>
    </body>

<script>
    var config;
    getClockConfig = function getClockConfig() {
        var deferred = $.Deferred();
        console.log('get clock values');
        var ajaxOptions = {
            url: '/api/getConfig',
            type: 'GET',
            Accept: 'application/json; charset=utf-8'
        };
        $.ajax(ajaxOptions).done(function (receivedConfig) {
            console.log("Received data: " + JSON.stringify(receivedConfig));
            deferred.resolve(receivedConfig);
        }).fail(function (jqXHR) {
            console.log("Get api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    getConfig = function () {
        getClockConfig().then(function (receivedConfig) {
            config = receivedConfig;
            setWidgets(config);
            removeLoader();
        })
    }

    setWidgets = function(config) {
        // -------------- General --------------
        var values;
        if (config.tubeType == "0") {
            values = config.counterValuesZIN70.split(';');
            $("#time-1-K").prop('disabled', false);
        } else {
            values = config.counterValuesZIN18.split(';');
            $("#time-1-K").prop('disabled', true);
        }

        $("#time-1-0").val(values[0]);
        $("#time-1-1").val(values[1]);
        $("#time-1-2").val(values[2]);
        $("#time-1-3").val(values[3]);
        $("#time-1-4").val(values[4]);
        $("#time-1-5").val(values[5]);
        $("#time-1-6").val(values[6]);
        $("#time-1-7").val(values[7]);
        $("#time-1-8").val(values[8]);
        $("#time-1-9").val(values[9]);
        $("#time-1-K").val(values[10]);

        $("#repetitions").val(values[12]);

        $("#tubeboardcount").val(config.tubeBoardCount);

        $("#tubeType").val(config.tubeType);
    };

    postConfig = function postConfig() {
        var deferred = $.Deferred();
        console.log('post config values');

        var postBody = {
        };

        // -------------- General --------------

        var counterValues = "";
        counterValues = counterValues + $("#time-1-0").val() + ";";
        counterValues = counterValues + $("#time-1-1").val() + ";";
        counterValues = counterValues + $("#time-1-2").val() + ";";
        counterValues = counterValues + $("#time-1-3").val() + ";";
        counterValues = counterValues + $("#time-1-4").val() + ";";
        counterValues = counterValues + $("#time-1-5").val() + ";";
        counterValues = counterValues + $("#time-1-6").val() + ";";
        counterValues = counterValues + $("#time-1-7").val() + ";";
        counterValues = counterValues + $("#time-1-8").val() + ";";
        counterValues = counterValues + $("#time-1-9").val() + ";";
        counterValues = counterValues + $("#time-1-K").val() + ";";

        counterValues = counterValues + $("#tubetype").val() + ";";
        counterValues = counterValues + $("#repetitions").val() + ";";

        postBody["counterValues"] = counterValues;
        postBody["tubeBoardCount"] = $("#tubeboardcount").val();
        postBody["tubeType"] = $("#tubeType").val();

        // ----------------------------------

        if ($("#tubetype").val() == "0") {
            postBody["counterValuesZIN70"] = counterValues;
        } else {
            postBody["counterValuesZIN18"] = counterValues;
        }

        // ----------------------------------

        var ajaxOptions = {
            url: '/api/postConfig',
            type: 'POST',
            data: JSON.stringify(postBody)
        };
        $.ajax(ajaxOptions).done(function (res) {
            console.log("Saved config");
            deferred.resolve(res);
        }).fail(function (jqXHR) {
            console.log("Post api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    saveConfig = function () {
        addLoader();
        postConfig()
        .then(function (config) {
            console.log("Saved config");
            setWidgets(config);
            removeLoader();
        });
    };

    function handleTubeTypeChange() {
        config.tubeType = $("#tubeType").val();
        setWidgets(config);
    }

    function addLoader() {
        $('body').append('<div style="" id="loadingDiv"><div class="loader">Loading...</div></div>');
    }

    function removeLoader() {
        $("#loadingDiv").fadeOut(500, function () {
            $("#loadingDiv").remove();
        });
    }

    addLoader();
    getConfig();
    
</script>

</html>
